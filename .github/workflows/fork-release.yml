name: Fork Release
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_version_bump:
    if: github.repository != 'mihonapp/mihon'
    name: Check for version bump
    runs-on: ubuntu-24.04
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Compare versionName against previous commit
        id: check
        run: |
          CURRENT="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: build regardless of version bump, tag with run number
            # so it can't collide with a real vX.Y.Z release tag later.
            echo "version=$CURRENT-manual.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            PREVIOUS="$(git show HEAD~1:app/build.gradle.kts | grep -oP 'versionName\s*=\s*"\K[^"]+' || echo "")"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "bumped=true" >> "$GITHUB_OUTPUT"
            else
              echo "bumped=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    if: github.repository != 'mihonapp/mihon' && needs.check_version_bump.outputs.bumped == 'true'
    name: Build
    runs-on: ubuntu-24.04
    needs: check_version_bump

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater
        env:
          MIHON_GITHUB_RELEASE: true
          RUNNER_TEMP: ${{ runner.temp }}
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e
          TAG="v${{ needs.check_version_bump.outputs.version }}"
          mv app/build/outputs/apk/release/app-universal-release.apk TurboMihon-$TAG.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk TurboMihon-arm64-v8a-$TAG.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk TurboMihon-armeabi-v7a-$TAG.apk
          mv app/build/outputs/apk/release/app-x86-release.apk TurboMihon-x86-$TAG.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk TurboMihon-x86_64-$TAG.apk

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbomihon-apks
          path: TurboMihon-*.apk

  release:
    if: github.repository != 'mihonapp/mihon'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [check_version_bump, build]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: turbomihon-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.check_version_bump.outputs.version }}
          name: TurboMihon v${{ needs.check_version_bump.outputs.version }}
          body: Automated build for TurboMihon (personal fork), synced from upstream mihonapp/mihon.
          files: TurboMihon-*.apk
          draft: false
          prerelease: false
