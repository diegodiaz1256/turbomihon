name: Upstream Sync
on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    if: github.repository != 'mihonapp/mihon'
    name: Sync with upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/mihonapp/mihon.git
          git fetch upstream

          LATEST_TAG="$(gh api repos/mihonapp/mihon/releases/latest --jq '.tag_name')"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"

      - name: Check for new upstream release
        id: check
        run: |
          if git merge-base --is-ancestor "$LATEST_TAG" origin/main; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release into sync branch
        if: steps.check.outputs.new == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B upstream-sync origin/main
          if git merge --no-edit "$LATEST_TAG"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

          # GITHUB_TOKEN can never push changes to .github/workflows/* (GitHub
          # platform restriction, not fixable via permissions:). Revert any
          # workflow-file changes pulled in by the merge so the push succeeds;
          # upstream workflow changes must be cherry-picked manually.
          if ! git diff --quiet origin/main -- .github/workflows/; then
            git checkout origin/main -- .github/workflows/
            git commit -m "Keep fork's own .github/workflows/ (GITHUB_TOKEN can't push workflow changes)" --allow-empty
          fi

          git push --force-with-lease origin upstream-sync

      - name: Open or update PR
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          if [ "$CONFLICT" = "true" ]; then
            BODY="Automated sync from upstream mihonapp/mihon release $LATEST_TAG. **Merge conflicts present** - resolve them in this PR before merging."
          else
            BODY="Automated sync from upstream mihonapp/mihon release $LATEST_TAG. Merged cleanly, no conflicts."
          fi
          if git log origin/main..upstream-sync --oneline -- .github/workflows/ | grep -q .; then
            NOTE="**Note:** upstream/main has changes under .github/workflows/ that were NOT included (GITHUB_TOKEN can't push workflow file changes). Check upstream's build.yml/release.yml manually and cherry-pick if needed."
            BODY="$(printf '%s\n\n%s' "$BODY" "$NOTE")"
          fi
          EXISTING_PR="$(gh pr list --head upstream-sync --state open --json number -q '.[0].number' || true)"
          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" --body "$BODY"
          else
            gh pr create --base main --head upstream-sync --title "Sync with upstream mihonapp/mihon ($LATEST_TAG)" --body "$BODY"
          fi
